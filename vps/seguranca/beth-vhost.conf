# beth.chicofigueiredo.com.br → hermes-webui (127.0.0.1:8787)
#
# Instalação:
#   cp deploy/nginx/beth.chicofigueiredo.com.br.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/beth.chicofigueiredo.com.br.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d beth.chicofigueiredo.com.br
#
# O certbot reescreve este arquivo adicionando o bloco 443 e o redirect.

# Nome próprio para não colidir com um $connection_upgrade que outro
# site deste servidor já tenha definido — map é global no contexto http.
map $http_upgrade $beth_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name beth.chicofigueiredo.com.br;

    # A webui aceita POST de até 20 MB; deixamos folga para o envelope.
    client_max_body_size 25m;

    access_log /var/log/nginx/beth.access.log;
    error_log  /var/log/nginx/beth.error.log;

    location / {
        auth_basic "beth";
        auth_basic_user_file /etc/nginx/beth.htpasswd;

        # Freio de forca bruta: 20 req/s por IP, com folga de 40 em rajada.
        # A webui faz varias requisicoes por interacao, entao o limite e alto
        # o suficiente para nao atrapalhar o uso normal do chat.
        limit_req zone=beth_zone burst=40 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSocket — o chat não funciona sem estes dois
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $beth_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O agente pensa devagar. 60s (padrão) corta resposta longa no meio.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Sem isto a resposta chega de uma vez só, no fim — em vez de
        # aparecer token a token. Buffer do nginx engole o streaming.
        proxy_buffering off;
        proxy_cache     off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/beth.chicofigueiredo.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/beth.chicofigueiredo.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = beth.chicofigueiredo.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name beth.chicofigueiredo.com.br;
    return 404; # managed by Certbot


}