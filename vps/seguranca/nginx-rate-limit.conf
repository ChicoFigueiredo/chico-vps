# Zonas de rate limit. Precisam viver no contexto http (aqui), nao dentro de
# server{} — por isso ficam em conf.d e nao no vhost.
limit_req_zone $binary_remote_addr zone=beth_zone:10m rate=20r/s;
# 429 em vez do 503 padrao: e o codigo correto para "excesso de requisicoes"
# e nao faz o cliente achar que o servidor caiu.
limit_req_status 429;
