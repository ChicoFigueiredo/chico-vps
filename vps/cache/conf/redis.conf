# Redis compartilhado — "cache"
#
# Um servidor, vários projetos, isolados por ACL e prefixo de chave.

################################## REDE ######################################
bind 0.0.0.0
port 6379

# Desligado de propósito. A proteção aqui são três camadas concretas:
#   1. a porta só existe em 127.0.0.1 no host (a internet não alcança)
#   2. só quem entra na rede 'rede-cache' enxerga o container
#   3. TODO usuário precisa de senha, inclusive o default (via aclfile)
# O protected-mode existe para o caso de um Redis sem senha exposto — não é
# o nosso, e mantê-lo ligado com bind 0.0.0.0 só gera confusão no diagnóstico.
protected-mode no

################################## ACL #######################################
# Usuários em arquivo, para sobreviverem a restart e poderem ser criados em
# tempo de execução pelo novo-cache.sh (que roda ACL SAVE ao final).
aclfile /data/users.acl

################################# MEMORIA ####################################
maxmemory 256mb

# A decisão que mais importa num Redis compartilhado.
#
# 'allkeys-lru' despejaria QUALQUER chave sob pressão — inclusive a fila de
# jobs ou a sessão de um projeto, silenciosamente.
# 'noeviction' faria o cache de um projeto derrubar a escrita de todos.
#
# 'volatile-lru' só despeja chave que tem TTL — ou seja, o que o próprio app
# marcou como descartável. Fila e sessão sem TTL ficam intactas.
#
# Consequência a conhecer: se a memória encher e não houver chave com TTL,
# escritas passam a falhar com OOM em vez de apagar dado de alguém. É o
# comportamento correto, mas é um erro que aparece — não um sumiço silencioso.
maxmemory-policy volatile-lru

############################### PERSISTENCIA #################################
dir /data

# AOF: sobrevive a restart com perda máxima de 1 segundo. É o que permite usar
# este Redis para fila e sessão, não só cache.
appendonly yes
appendfsync everysec

# RDB em paralelo, para o backup diário ter um arquivo único e coerente.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

################################### LOG ######################################
loglevel notice
